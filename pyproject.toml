[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoesass2"
version = "0.1.0"
description = "Fail-closed, auditable GeoTIFF research pipeline for the GEMS Prize Challenge"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "GEMSDOESASS2 contributors"}]
dependencies = [
  "affine>=2.4,<4",
  "numpy>=1.26,<3",
  "rasterio>=1.3,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
