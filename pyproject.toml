[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gems-sass2"
version = "1.0.0"
description = "GEMSDOESASS2: Gallardo-Meju Cross-Gradient, Convective Hydrothermal & Dual-Horizon PU Submodular Discovery for the DOE GEMS Prize"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "rasterio>=1.3",
  "scikit-learn>=1.4",
  "scikit-image>=0.22",
  "lightgbm>=4.3",
  "matplotlib>=3.8",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
