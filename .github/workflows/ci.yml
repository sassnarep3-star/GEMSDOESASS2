name: Verify Submission & Protocol Gates

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-audit.txt
      - name: Run automated protocol, GeoTIFF format/range, and Run Card checks
        run: |
          python -m pytest -v
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Verify decision site behavior
        run: |
          npm ci
          node --check docs/assets/app.js
          npm run test:site
